name: backqup tests
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      GO_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install age (round-trip test is skipped without it)
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Placeholder for the embedded web UI
        run: mkdir -p web/dist && touch web/dist/index.html
      - run: go vet ./...
      - run: go test ./...

  e2e:
    name: End-to-end (dump, encrypt, S3, decrypt, restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t backqup:dev .
      - name: Run e2e
        run: sh tests/e2e/run.sh
